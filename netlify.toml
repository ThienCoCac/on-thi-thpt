[build]
  command = "npm run build"
  # next.config.mjs dùng output: 'export' nên site tĩnh nằm trong out/
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ----- Bảo mật: header áp dụng cho toàn bộ response -----
# Lưu ý: KHÔNG đặt Content-Security-Policy ở đây vì Next.js chèn inline script
# cho hydration; nếu muốn bật CSP cần dùng nonce/hash.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ----- Cache vĩnh viễn cho asset tĩnh có hash -----
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ảnh thương hiệu tĩnh trong /public: cache 1 tuần, cho phép revalidate.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sitemap & robots thay đổi khi nội dung mới được xuất bản.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
